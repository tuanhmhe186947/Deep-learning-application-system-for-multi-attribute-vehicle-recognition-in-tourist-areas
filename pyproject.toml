[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = '''
/(
  sources/yolov5
  | resources
  | output
  | storage
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "sources/yolov5",
  "resources",
  "output",
  "storage",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
ignore = ["E501"]
